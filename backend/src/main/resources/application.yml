spring:
  application:
    name: ems-backend

  datasource:
    url: {{POSTGRES_URL}}git add .
    username: {{POSTGRES_USER}}
    password: {{POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080